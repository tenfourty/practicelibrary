# Build the practicelibrary container image IN-CLUSTER and push to the
# forge registry. Pattern: per-job dind service + docker:cli job
# container (runner config untouched; the outer privileged dind runs
# both). First proven 2026-09-02 — template for all forge image builds
# (incl. the talos i915 extension rebuilds).
name: build-image
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: docker
    container:
      image: docker:28-cli
    services:
      dind:
        image: docker:28-dind
        options: >-
          --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
    env:
      DOCKER_HOST: tcp://dind:2375
    steps:
      - uses: actions/checkout@v4
      - name: wait for daemon
        run: |
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info >/dev/null
      - name: build and push
        run: |
          docker login git.tenfourty.site -u jeremy -p "${{ secrets.REGISTRY_TOKEN }}"
          docker build -t git.tenfourty.site/jeremy/practicelibrary:latest -t git.tenfourty.site/jeremy/practicelibrary:${GITHUB_SHA::12} .
          docker push git.tenfourty.site/jeremy/practicelibrary:latest
          docker push git.tenfourty.site/jeremy/practicelibrary:${GITHUB_SHA::12}
