# Build the practicelibrary container image IN-CLUSTER and push to the
# forge registry. Pattern: per-job dind SERVICE + the runner's default
# job image (node:22-bookworm — forgejo-runner needs `node` in the job
# container to run actions/checkout; docker:cli has none, run 164 died
# on "exec: node: executable file not found") + a static docker CLI
# fetched at job start. Runner config untouched. Template for all forge
# image builds (incl. the talos i915 extension rebuilds).
name: build-image
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: docker
    services:
      dind:
        image: docker:28-dind
        options: >-
          --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
    env:
      DOCKER_HOST: tcp://dind:2375
      DOCKER_CLI_VERSION: "28.3.3"
    steps:
      - uses: actions/checkout@v4
      - name: install docker cli
        run: |
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_CLI_VERSION}.tgz" \
            | tar -xz -C /usr/local/bin --strip-components=1 docker/docker
          docker --version
      - name: wait for daemon
        run: |
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info >/dev/null
      - name: build and push
        run: |
          docker login git.tenfourty.site -u jeremy -p "${{ secrets.REGISTRY_TOKEN }}"
          docker build -t git.tenfourty.site/jeremy/practicelibrary:latest -t git.tenfourty.site/jeremy/practicelibrary:${GITHUB_SHA::12} .
          docker push git.tenfourty.site/jeremy/practicelibrary:latest
          docker push git.tenfourty.site/jeremy/practicelibrary:${GITHUB_SHA::12}
